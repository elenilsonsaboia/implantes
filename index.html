<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sistema de Implantes</title>
<style>
:root{
  --bg:#f4f6f9; --surface:#ffffff; --surface-2:#f8f9fb; --border:#e1e5eb; --border-strong:#c9d0da;
  --ink:#1b2430; --ink-2:#4a5566; --ink-3:#7a8597;
  --accent:#1f6feb; --accent-ink:#ffffff; --accent-soft:#e8f0fe;
  --bar:#3b7ddd;
  --good:#1e8e4e; --good-soft:#e5f5ec;
  --warn:#b26a00; --warn-soft:#fdf2df;
  --crit:#c62828; --crit-soft:#fdeaea;
  --c-caxias:#2563eb; --c-penha:#16a34a; --c-itaguai:#d4a106; --c-outra:#8a94a6;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
  --radius:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11151b; --surface:#1a2029; --surface-2:#202733; --border:#2c3542; --border-strong:#3b4656;
    --ink:#e7ecf3; --ink-2:#b3bdcb; --ink-3:#8692a3;
    --accent:#4c8dff; --accent-ink:#0b1220; --accent-soft:#1d2b44; --bar:#5d97ec;
    --good:#4cc781; --good-soft:#173324; --warn:#e9a640; --warn-soft:#3a2b12; --crit:#ff6b6b; --crit-soft:#3d1c1c;
    --c-caxias:#5b8ff9; --c-penha:#3fbf6f; --c-itaguai:#e3b72f; --c-outra:#8a94a6;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#11151b; --surface:#1a2029; --surface-2:#202733; --border:#2c3542; --border-strong:#3b4656;
  --ink:#e7ecf3; --ink-2:#b3bdcb; --ink-3:#8692a3;
  --accent:#4c8dff; --accent-ink:#0b1220; --accent-soft:#1d2b44; --bar:#5d97ec;
  --good:#4cc781; --good-soft:#173324; --warn:#e9a640; --warn-soft:#3a2b12; --crit:#ff6b6b; --crit-soft:#3d1c1c;
  --c-caxias:#5b8ff9; --c-penha:#3fbf6f; --c-itaguai:#e3b72f; --c-outra:#8a94a6;
  --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
nav.side{background:var(--surface);border-right:1px solid var(--border);padding:16px 10px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:2px}
.brand{padding:4px 10px 16px}
.brand b{display:block;font-size:15px}
.brand span{color:var(--ink-3);font-size:12px}
nav.side a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:8px;color:var(--ink-2);text-decoration:none;cursor:pointer}
nav.side a:hover{background:var(--surface-2);color:var(--ink)}
nav.side a.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
nav.side .count{font-size:12px;color:var(--ink-3);font-weight:400}
nav.side .spacer{flex:1}
.side-foot{font-size:12px;color:var(--ink-3);padding:8px 10px;border-top:1px solid var(--border);margin-top:8px}
.side-foot .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle;background:var(--ink-3)}
.side-foot .dot.on{background:var(--good)}
main{padding:20px 24px 60px;min-width:0}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.head h1{font-size:20px;margin:0}
.head p{margin:2px 0 0;color:var(--ink-3);font-size:13px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar input[type=search]{min-width:240px;flex:1;max-width:360px}
input,select,textarea{background:var(--surface);border:1px solid var(--border-strong);border-radius:8px;padding:7px 10px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea{min-height:70px;resize:vertical;width:100%}
.btn{border:1px solid var(--border-strong);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.btn.sm{padding:3px 8px;font-size:12px}
.btn.ghost{border-color:transparent;background:transparent}
label.chk{display:inline-flex;gap:6px;align-items:center;color:var(--ink-2);cursor:pointer;user-select:none}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.tablewrap{overflow:auto;max-height:calc(100vh - 190px)}
table{border-collapse:separate;border-spacing:0;width:100%}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap;vertical-align:middle}
th{position:sticky;top:0;background:var(--surface-2);font-size:12px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-2);cursor:pointer;z-index:1;user-select:none}
th.nosort{cursor:default}
th .arr{color:var(--ink-3);font-size:10px;margin-left:4px}
td.wrap{white-space:normal;min-width:180px;max-width:320px}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--surface-2)}
tr td:first-child{border-left:4px solid transparent}
tr.cl-caxias td:first-child{border-left-color:var(--c-caxias)}
tr.cl-penha td:first-child{border-left-color:var(--c-penha)}
tr.cl-itaguai td:first-child{border-left-color:var(--c-itaguai)}
tr.cl-outra td:first-child{border-left-color:var(--c-outra)}
tfoot td{font-weight:700;background:var(--surface-2);position:sticky;bottom:0}
.empty{padding:40px;text-align:center;color:var(--ink-3)}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--border)}
.badge.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.badge.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.badge.crit{background:var(--crit-soft);color:var(--crit);border-color:transparent}
.badge.info{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.cl{display:inline-flex;align-items:center;gap:6px}
.cl i{width:9px;height:9px;border-radius:50%;display:inline-block}
.muted{color:var(--ink-3)}
.neg{color:var(--crit)}
/* painel */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{padding:14px 16px}
.kpi .l{color:var(--ink-2);font-size:12px;text-transform:uppercase;letter-spacing:.03em}
.kpi .v{font-size:24px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .s{color:var(--ink-3);font-size:12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;margin-bottom:16px}
.panel{padding:14px 16px}
.panel h3{margin:0 0 10px;font-size:14px}
.alerts{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;margin-bottom:16px}
.alert{display:flex;gap:10px;align-items:center;padding:10px 12px;cursor:pointer}
.alert:hover{border-color:var(--border-strong)}
.alert .n{font-size:20px;font-weight:700;min-width:36px;text-align:center;border-radius:8px;padding:4px 6px;font-variant-numeric:tabular-nums}
.alert.crit .n{background:var(--crit-soft);color:var(--crit)}
.alert.warn .n{background:var(--warn-soft);color:var(--warn)}
.alert.ok .n{background:var(--good-soft);color:var(--good)}
.alert .t{font-size:13px;color:var(--ink-2)}
.alert .t b{color:var(--ink);display:block;font-weight:600}
.bars{display:flex;flex-direction:column;gap:6px}
.barrow{display:grid;grid-template-columns:170px 1fr 40px;align-items:center;gap:8px;font-size:13px;cursor:pointer;padding:2px 0}
.barrow:hover .lbl{color:var(--ink)}
.barrow .lbl{color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.barrow .track{height:14px;position:relative}
.barrow .fill{height:100%;background:var(--bar);border-radius:0 4px 4px 0;min-width:2px}
.barrow:hover .fill{filter:brightness(1.12)}
.barrow .val{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.mini td,.mini th{padding:6px 8px;font-size:13px}
.mini th{position:static;cursor:default}
/* modal */
.overlay{position:fixed;inset:0;background:rgba(10,15,25,.45);display:flex;align-items:flex-start;justify-content:center;padding:30px 16px;overflow:auto;z-index:50}
.modal{width:min(920px,100%);background:var(--surface);border-radius:12px;box-shadow:0 20px 50px rgba(0,0,0,.3);border:1px solid var(--border)}
.modal header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--border)}
.modal header h2{margin:0;font-size:17px}
.modal .body{padding:16px 18px}
.modal footer{display:flex;justify-content:space-between;gap:8px;padding:12px 18px;border-top:1px solid var(--border);background:var(--surface-2);border-radius:0 0 12px 12px}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.form .f{display:flex;flex-direction:column;gap:4px}
.form .f.full{grid-column:1/-1}
.form .f label{font-size:12px;color:var(--ink-2);font-weight:600}
.form .f input,.form .f select{width:100%}
.combo{position:relative;display:flex}
.combo input{padding-right:32px}
.combo .cb-btn{position:absolute;right:1px;top:1px;bottom:1px;width:30px;border:0;background:transparent;color:var(--ink-2);cursor:pointer;border-radius:0 8px 8px 0}
.combo .cb-btn:hover{background:var(--surface-2)}
.combo .cb-list{position:absolute;left:0;min-width:100%;width:max-content;max-width:min(440px,90vw);top:100%;margin-top:2px;max-height:240px;overflow:auto;background:var(--surface);border:1px solid var(--border-strong);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.18);z-index:60;display:none}
.combo .cb-list.on{display:block}
.combo .cb-list div{padding:6px 10px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.combo .cb-list div.sel,.combo .cb-list div:hover{background:var(--accent-soft);color:var(--accent)}
.combo .cb-list .cb-vazio{color:var(--ink-3);cursor:default;background:none}
.form h4{grid-column:1/-1;margin:8px 0 -4px;font-size:12px;text-transform:uppercase;color:var(--ink-3);letter-spacing:.04em;border-top:1px solid var(--border);padding-top:12px}
.pgs{width:100%;border-collapse:collapse;font-size:13px}
.pgs th{text-align:left;font-size:11px;color:var(--ink-3);font-weight:600;padding:2px 4px}
.pgs td{padding:2px 4px}
.pgs td input,.pgs td select{width:100%}
.form .tot{font-size:13px;color:var(--ink-2);margin-top:6px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.calc{grid-column:1/-1;display:flex;gap:10px;flex-wrap:wrap}
.calc div{background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:13px}
.calc b{display:block;font-size:15px}
.linked{margin-top:16px;border-top:1px solid var(--border);padding-top:12px}
.linked h4{margin:0 0 6px;font-size:13px}
.linked ul{margin:0 0 8px;padding-left:18px;color:var(--ink-2);font-size:13px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;z-index:60;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.settings section{margin-bottom:16px;padding:16px}
.settings h3{margin:0 0 6px;font-size:15px}
.settings p{margin:0 0 10px;color:var(--ink-2)}
.lists{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.lists textarea{min-height:120px;font-size:13px}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:10px 14px;margin-bottom:12px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.menu-btn{display:none}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  nav.side{position:fixed;left:0;top:0;z-index:40;width:240px;transform:translateX(-100%);transition:transform .2s;box-shadow:var(--shadow)}
  nav.side.open{transform:none}
  main{padding:14px 16px 60px}
  .menu-btn{display:inline-block}
  .toolbar input[type=search]{min-width:0;max-width:none;width:100%}
  .barrow{grid-template-columns:120px 1fr 34px}
}
/* relatório */
.rel-sec{padding:14px 16px;margin-bottom:16px}
.rel-sec h3{margin:0 0 10px;font-size:14px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.rel-sec h3 small{font-weight:400;color:var(--ink-3);font-size:12px}
.rel-sec .tablewrap{max-height:none}
.rel-sec table.mini tbody tr{cursor:default}
.rel-sec table.mini tbody tr[data-open]{cursor:pointer}
.rel-periodo{color:var(--ink-2);font-size:13px;margin:-6px 0 12px}
@media print{nav.side,.toolbar,.menu-btn,.no-print{display:none!important}.app{display:block}.tablewrap{max-height:none;overflow:visible}main{padding:0}.card{box-shadow:none;break-inside:avoid}.rel-sec{break-inside:auto}th{position:static}tfoot td{position:static}}
</style>
</head>
<body>
<div class="app">
  <nav class="side" id="side">
    <div class="brand"><b>Controle de Implantes</b><span>Dr.ª Ana Cristina &amp; Dr. Elenilson</span></div>
    <a data-view="tomografias">Tomografias <span class="count" id="n-tomografias"></span></a>
    <a data-view="pacientes">Pacientes <span class="count" id="n-pacientes"></span></a>
    <a data-view="financeiro">Financeiro <span class="count" id="n-financeiro"></span></a>
    <a data-view="vales">Vales e comissões <span class="count" id="n-vales"></span></a>
    <a data-view="estoque">Estoque <span class="count" id="n-estoque"></span></a>
    <a data-view="movimentacoes">Movimentações <span class="count" id="n-movimentacoes"></span></a>
    <a data-view="painel">Painel</a>
    <a data-view="relatorio">Relatórios</a>
    <span class="spacer"></span>
    <a data-view="config">Backup e cadastros</a>
    <div class="side-foot" id="syncInfo"></div>
  </nav>
  <main id="main"></main>
</div>
<div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
'use strict';
/* ============ armazenamento (Supabase) ============ */
const KEY = 'sistema_implantes_db_v1';
const SB_URL = 'https://vfafxqcrdtiyxuhvdpkf.supabase.co', SB_KEY = 'sb_publishable_CHERDqckUL5FkZx5jnkbNw_4Hk_ssWD';
const sb = supabase.createClient(SB_URL, SB_KEY);
const COLS = ['pacientes', 'tomografias', 'financeiro', 'estoque', 'movimentacoes', 'vales'];
let db = { versao: 1, listas: {}, importacoes: [] };
function normDb() {
  for (const k of COLS) db[k] = db[k] || [];
  db.listas = db.listas || {};
  db.importacoes = db.importacoes || [];
  if (!db.listas.formaPagamento) db.listas.formaPagamento = ['PIX', 'DINHEIRO', 'CARTAO', 'BOLETO'];
  if (!db.listas.tipoRecebimento) db.listas.tipoRecebimento = ['VALE', 'COMISSAO'];
  for (const v of db.vales) if (!v.tipo) v.tipo = 'VALE';
}
normDb();

// texto estável (chaves ordenadas) para comparar com o que veio do banco (jsonb reordena as chaves)
const estavel = v => JSON.stringify(v, (k, x) => x && typeof x === 'object' && !Array.isArray(x) ? Object.keys(x).sort().reduce((o, c) => (o[c] = x[c], o), {}) : x);
function linhasDe(d) {
  const m = new Map();
  for (const c of COLS) for (const r of d[c]) m.set(c + '|' + r.id, { colecao: c, id: String(r.id), dados: r });
  m.set('_meta|listas', { colecao: '_meta', id: 'listas', dados: d.listas });
  m.set('_meta|importacoes', { colecao: '_meta', id: 'importacoes', dados: d.importacoes });
  return m;
}

let snap = new Map();      // 'colecao|id' -> texto estável do que está no banco
let usuario = null, carregado = false, online = false, enviando = false, deNovo = false, envioTimer = null, ultimoEnvio = null;
const filaCarregar = [];
// papéis: admin vê tudo; recepção só Tomografias e Pacientes (o banco também barra o resto)
const ABAS_RECEPCAO = ['tomografias', 'pacientes'];
const ehAdmin = () => usuario?.papel === 'admin';
const podeGravar = c => ehAdmin() || ABAS_RECEPCAO.includes(c);
// scripts de ajuste de dados (*.js com MARCA) usam aoCarregar(fn): roda depois que os dados do banco chegaram
function aoCarregar(fn) { if (carregado) fn(); else filaCarregar.push(fn); }

function persist() {
  db.atualizadoEm = new Date().toISOString();
  if (!carregado) return;
  clearTimeout(envioTimer);
  envioTimer = setTimeout(enviar, 250);
  updateSyncInfo();
}
async function enviar() {
  if (enviando) { deNovo = true; return; }
  enviando = true;
  try {
    const cur = linhasDe(db), rows = [], novos = new Map();
    for (const [k, v] of cur) { const s = estavel(v.dados); if (snap.get(k) !== s) { if (podeGravar(v.colecao)) rows.push({ ...v, excluido: false }); novos.set(k, s); } }
    for (const [k, s] of snap) if (!cur.has(k)) { const [c, ...i] = k.split('|'); if (podeGravar(c)) rows.push({ colecao: c, id: i.join('|'), dados: JSON.parse(s), excluido: true }); novos.set(k, null); }
    for (let i = 0; i < rows.length; i += 500) {
      const { error } = await sb.from('registros').upsert(rows.slice(i, i + 500));
      if (error) throw error;
    }
    for (const [k, s] of novos) s === null ? snap.delete(k) : snap.set(k, s);
    if (rows.length) ultimoEnvio = new Date();
    online = true;
  } catch (e) {
    online = false;
    toast('Não foi possível salvar no servidor (' + (e.message || e) + '). Tentando de novo…');
    setTimeout(persist, 5000);
  } finally {
    enviando = false; updateSyncInfo();
    if (deNovo) { deNovo = false; enviar(); }
  }
}
function temPendente() {
  if (!carregado) return false;
  const cur = linhasDe(db);
  for (const [k, v] of cur) if (snap.get(k) !== estavel(v.dados)) return true;
  for (const k of snap.keys()) if (!cur.has(k)) return true;
  return false;
}
window.addEventListener('beforeunload', e => { if (enviando || temPendente()) { e.preventDefault(); e.returnValue = ''; } });

async function carregarTudo() {
  const rows = [];
  for (let de = 0; ; de += 1000) {
    const { data, error } = await sb.from('registros').select('colecao,id,dados').eq('excluido', false).order('colecao').order('id').range(de, de + 999);
    if (error) throw error;
    rows.push(...data); if (data.length < 1000) break;
  }
  const d = { versao: 1, listas: {}, importacoes: [] };
  for (const c of COLS) d[c] = [];
  snap = new Map();
  for (const r of rows) {
    if (r.colecao === '_meta') d[r.id] = r.dados; else if (d[r.colecao]) d[r.colecao].push(r.dados); else continue;
    snap.set(r.colecao + '|' + r.id, estavel(r.dados));
  }
  db = d; normDb(); carregado = true; online = true;
  return rows.length;
}

// alterações feitas por outras pessoas chegam aqui na hora
function aplicarRemoto(r) {
  if (!r || !r.colecao) return;
  const k = r.colecao + '|' + r.id, s = estavel(r.dados);
  if (r.excluido) {
    if (!snap.has(k)) return;
    snap.delete(k);
    if (r.colecao !== '_meta' && db[r.colecao]) db[r.colecao] = db[r.colecao].filter(x => String(x.id) !== r.id);
  } else {
    if (snap.get(k) === s) return; // eco do que eu mesmo salvei
    snap.set(k, s);
    if (r.colecao === '_meta') db[r.id] = r.dados;
    else if (db[r.colecao]) {
      const atual = db[r.colecao].find(x => String(x.id) === r.id);
      // atualiza o mesmo objeto, para não perder a referência de um formulário aberto
      if (atual) { for (const c of Object.keys(atual)) delete atual[c]; Object.assign(atual, r.dados); } else db[r.colecao].push(r.dados);
    }
  }
  normDb(); agendarRender();
}
let renderPendente = false, renderTimer = null;
function agendarRender() { renderPendente = true; clearTimeout(renderTimer); renderTimer = setTimeout(tentarRender, 300); }
function tentarRender() {
  if (!renderPendente) return;
  const a = document.activeElement;

function addMonths(iso, m) {

const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

/* ============ regras de negócio ============ */
function estoqueCalc(e) {
  let ent = 0, sai = 0;
  for (const m of db.movimentacoes) if (m.codigo === e.codigo) { if (m.tipo === 'ENTRADA') ent += num(m.qtd); else if (m.tipo === 'SAIDA') sai += num(m.qtd); }
  const saldo = num(e.saldoInicial) + ent - sai;
  const status = saldo <= 0 ? 'SEM ESTOQUE' : saldo <= num(e.minimo) ? 'REPOR' : 'OK';
  let val = '';
  if (e.validade) { const h = hoje(); val = e.validade < h ? 'VENCIDO' : diasEntre(h, e.validade) <= 60 ? 'VENCE EM 60 DIAS' : ''; }
  return { entradas: ent, saidas: sai, saldo, status, alertaValidade: val, valorEstoque: e.valorUnit ? saldo * num(e.valorUnit) : '' };
}
function finCalc(f) {

  const pagos = (f.pagamentos || []).reduce((a, p) => a + num(p.valor), 0), pago = num(f.entrada) + pagos;
  const ultPg = [...(f.pagamentos || []).map(p => p.data), num(f.entrada) ? f.dataEntrada : ''].filter(Boolean).sort().pop() || '';
  const debito = num(f.valor) - pago - num(f.desconto);
  const custos = num(f.cImpl) * q(f.qImpl) + num(f.cMpa) * q(f.qMpa) + num(f.cMpr) * q(f.qMpr) + num(f.cCil) * q(f.qCil) + num(f.cUcla) * q(f.qUcla) + num(f.enxerto) + num(f.membrana) + num(f.lab);
  // divisão só sobre o que foi pago: entrada + pagamentos (−10% dos que foram em cartão/boleto/pix) − laboratório = saldo, metade clínica / metade minha
  const tx = (v, forma) => /CARTAO|BOLETO|PIX/.test(norm(forma)) ? num(v) * 0.1 : 0;
  const total = pago;
  const taxa = tx(f.entrada, f.formaPagamento) + (f.pagamentos || []).reduce((a, p) => a + tx(p.valor, p.forma || f.formaPagamento), 0);
  const totalDesc = total - taxa, saldo = totalDesc - num(f.lab);
  return { pago, pagos, ultPg, debito, debito10: f.desc10Debito === "SIM" ? debito * 0.9 : debito, custos, liquido: num(f.valor) - num(f.desconto) - custos,

}
// vales e comissões recebidos x minha parte (por clínica)
function valesResumo() {
  const m = new Map(), get = c => m.get(c) || m.set(c, { parte: 0, manut: 0, vales: 0, comissoes: 0 }).get(c);
  // manut: quanto da minha parte veio de cobranças de manutenção (já está somado em parte)
  for (const f of db.financeiro) { const o = get(f.clinica || ''), pm = finCalc(f).parteMinha; o.parte += pm; if (f.planejamento === 'MANUTENCAO') o.manut += pm; }
  for (const v of db.vales) get(v.clinica || '')[v.tipo === 'COMISSAO' ? 'comissoes' : 'vales'] += num(v.valor);
  const rows = [...m.entries()].filter(([, o]) => o.parte || o.vales || o.comissoes).map(([c, o]) => ({ c, ...o, saldo: o.parte - o.vales - o.comissoes }));
  const t = rows.reduce((a, x) => ({ parte: a.parte + x.parte, manut: a.manut + x.manut, vales: a.vales + x.vales, comissoes: a.comissoes + x.comissoes, saldo: a.saldo + x.saldo }), { parte: 0, manut: 0, vales: 0, comissoes: 0, saldo: 0 });

function syncBaixa(p) {
  const i = db.movimentacoes.findIndex(m => m.autoPaciente === p.id), mov = i >= 0 ? db.movimentacoes[i] : null;
  const e = p.codigoImplante ? db.estoque.find(x => x.codigo === p.codigoImplante) : null;
  if (!e || !p.dataCirurgia || p.dataCirurgia > hoje()) {
    if (mov) { db.movimentacoes.splice(i, 1); return 'Baixa automática no estoque desfeita.'; }
    return '';
  }
  const qtd = num(p.qtd) || 1;
  const dados = { data: p.dataCirurgia, codigo: e.codigo, tipo: 'SAIDA', qtd, local: e.local || L('localEstoque')[0] || '', paciente: p.nome };
  const aviso = () => { const s = estoqueCalc(e).saldo; return s < 0 ? ` ATENÇÃO: saldo de ${e.codigo} ficou ${s}.` : ''; };
  if (mov) {
    if (!Object.keys(dados).some(k => mov[k] !== dados[k])) return '';
    Object.assign(mov, dados); return `Baixa no estoque atualizada (${qtd}x ${e.codigo}).` + aviso();

  db.movimentacoes.push({ id: uid('m'), ...dados, lote: '', valorUnit: null, nf: '', obs: 'Baixa automática pela cirurgia', autoPaciente: p.id });

const headHtml = (t, s, right = '') => `<div class="head"><div><button class="btn menu-btn" onclick="document.getElementById('side').classList.toggle('open')">☰ Menu</button><h1>${t}</h1><p>${s}</p></div><div style="display:flex;gap:8px;flex-wrap:wrap">${right}</div></div>`;

/* ============ lista genérica ============ */
function rowsFor(view) {
  const S = SCHEMAS[view];
  const q = norm(UI.q[view] || ''), f = UI.f[view] || {}, fl = UI.flags[view] || {};
  let rows = db[view].map(r => ({ r, c: S.calc(r) }));
  rows = rows.filter(({ r, c }) => {
    for (const k in f) if (f[k] && r[k] !== f[k]) return false;
    for (const fg of S.flags) if (fl[fg.k] && !fg.fn(r, c)) return false;
    if (q) { const hay = norm(Object.values(r).join(' ') + ' ' + Object.values(c).join(' ')); if (!q.split(' ').every(w => hay.includes(w))) return false; }
    return true;
  });
  const s = UI.sort[view] || S.sortDefault; const col = S.cols.find(c => c.k === s.k);
  if (col) rows.sort((a, b) => {
    let x = col.calc ? a.c[s.k] : a.r[s.k], y = col.calc ? b.c[s.k] : b.r[s.k];
    const ex = x === '' || x === null || x === undefined, ey = y === '' || y === null || y === undefined;
    if (ex && ey) return 0; if (ex) return 1; if (ey) return -1;
    if (typeof x === 'number' && typeof y === 'number') return (x - y) * s.dir;
    return String(x).localeCompare(String(y), 'pt-BR', { numeric: true }) * s.dir;
  });
  return rows;
}
function cellHtml(col, r, c) {
  if (col.r) return col.r(r, c);
  const v = col.calc ? c[col.k] : r[col.k];
  if (col.t === 'date') return fmtD(v);
  if (col.t === 'money') return v === '' || v === null || v === undefined ? '' : `<span class="${v < 0 ? 'neg' : ''}">${fmtR(v)}</span>`;
  if (col.t === 'num') return fmtN(v);
  return esc(v);
}
function renderLista(view) {
  const S = SCHEMAS[view];
  const rows = rowsFor(view);
  const f = UI.f[view] || {}, fl = UI.flags[view] || {};
  const s = UI.sort[view] || S.sortDefault;
  const filtros = S.filtros.map(fi => `<select data-filter="${fi.k}"><option value="">${fi.l}</option>${L(fi.list).map(o => `<option ${f[fi.k] === o ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>`).join('');
  const flags = S.flags.map(fg => `<label class="chk"><input type="checkbox" data-flag="${fg.k}" ${fl[fg.k] ? 'checked' : ''}>${fg.l}</label>`).join('');
  const sums = S.cols.some(c => c.sum);
  const foot = sums ? `<tfoot><tr>${S.cols.map((c, i) => {
    if (i === 0) return `<td>Total (${rows.length})</td>`;
    if (!c.sum) return '<td></td>';
    const tot = rows.reduce((a, { r, c: cc }) => a + num(c.calc ? cc[c.k] : r[c.k]), 0);
    return `<td class="num ${tot < 0 ? 'neg' : ''}">${fmtR(tot)}</td>`;
  }).join('')}</tr></tfoot>` : '';
  $('#main').innerHTML = headHtml(S.titulo, S.sub, `<button class="btn" id="btnCsv">Exportar para Excel</button><button class="btn primary" id="btnNovo">+ Novo ${S.singular}</button>`) + (S.resumo ? S.resumo() : '') + `
    <div class="toolbar">
      <input type="search" id="busca" placeholder="Buscar (nome, observação, implante...)" value="${esc(UI.q[view] || '')}">
      ${filtros}${flags}
      <span class="muted">${rows.length} de ${db[view].length}</span>
    </div>
    <div class="card tablewrap">
      ${rows.length ? `<table><thead><tr>${S.cols.map(c => `<th data-sort="${c.k}" class="${c.t === 'money' || c.t === 'num' ? 'num' : ''} ${c.nosort ? 'nosort' : ''}">${c.l}${s.k === c.k ? `<span class="arr">${s.dir > 0 ? '▲' : '▼'}</span>` : ''}</th>`).join('')}</tr></thead>
      <tbody>${rows.map(({ r, c }) => `<tr data-id="${r.id}" class="cl-${clClass(r.clinica || r.local)}">${S.cols.map(col => `<td class="${col.wrap ? 'wrap' : ''} ${col.t === 'money' || col.t === 'num' ? 'num' : ''}">${cellHtml(col, r, c)}</td>`).join('')}</tr>`).join('')}</tbody>${foot}</table>`
      : `<div class="empty">Nenhum registro encontrado.</div>`}
    </div>`;
  const busca = $('#busca');
  busca.oninput = () => { UI.q[view] = busca.value; saveUI(); const pos = busca.selectionStart; renderLista(view); const b = $('#busca'); b.focus(); b.setSelectionRange(pos, pos); };
  document.querySelectorAll('[data-filter]').forEach(el => el.onchange = () => { (UI.f[view] = UI.f[view] || {})[el.dataset.filter] = el.value; saveUI(); renderLista(view); });
  document.querySelectorAll('[data-flag]').forEach(el => el.onchange = () => { (UI.flags[view] = UI.flags[view] || {})[el.dataset.flag] = el.checked; saveUI(); renderLista(view); });
  document.querySelectorAll('th[data-sort]:not(.nosort)').forEach(th => th.onclick = () => { const k = th.dataset.sort; const cur = UI.sort[view] || S.sortDefault; UI.sort[view] = { k, dir: cur.k === k ? -cur.dir : 1 }; saveUI(); renderLista(view); });
  document.querySelectorAll('tbody tr').forEach(tr => tr.onclick = ev => {
    const b = ev.target.closest('[data-mov]');
    if (b) { ev.stopPropagation(); openForm('movimentacoes', null, { codigo: b.dataset.cod, tipo: b.dataset.mov }); return; }
    openForm(view, tr.dataset.id);
  });
  $('#btnNovo').onclick = () => openForm(view);
  $('#btnCsv').onclick = () => exportCsv(view, rows);
}

function datalists() {
  // nomes de pacientes, tomografias/radiografias, financeiro, movimentações e vales — sem repetir o mesmo nome escrito diferente
  const nomes = new Map(); for (const n of [...db.pacientes.map(p => p.nome), ...db.tomografias.map(t => t.paciente), ...db.financeiro.map(f => f.paciente), ...db.movimentacoes.map(m => m.paciente), ...db.vales.map(v => v.paciente)]) if (n && !nomes.has(norm(n))) nomes.set(norm(n), n);
  const impl = new Set(db.estoque.filter(e => e.categoria === 'IMPLANTE').map(e => e.item)); for (const p of db.pacientes) if (p.tipoImplante) impl.add(p.tipoImplante);
  const opt = s => [...s].filter(Boolean).sort((a, b) => a.localeCompare(b, 'pt-BR')).map(v => `<option value="${esc(v)}">`).join('');
  return `<datalist id="dl-nomes">${opt(nomes.values())}</datalist><datalist id="dl-itensImplante">${opt(impl)}</datalist>`;
}

function comboInit(root) {
  root.querySelectorAll('[data-combo]').forEach(inp => {
    const box = inp.parentElement, list = box.querySelector('.cb-list');
    const todos = [...root.querySelector('#' + inp.dataset.combo).options].map(o => o.value);
    let itens = [], sel = -1;
    const pinta = () => list.querySelectorAll('[data-i]').forEach(d => d.classList.toggle('sel', +d.dataset.i === sel));
    const abre = (filtrar) => {
      const q = filtrar ? norm(inp.value) : ''; itens = q ? todos.filter(n => norm(n).includes(q)) : todos; sel = -1;
      list.innerHTML = itens.length ? itens.map((n, i) => `<div data-i="${i}">${esc(n)}</div>`).join('') : '<div class="cb-vazio">Nenhum paciente com esse nome — será cadastrado como novo</div>';
      list.classList.add('on');

const MESES = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
const fmtMes = ym => ym ? MESES[+ym.slice(5, 7) - 1] + '/' + ym.slice(0, 4) : '(sem data)';
const fimMes = ym => { const [y, m] = ym.split('-').map(Number); return isoOf(new Date(y, m, 0)); };
const REL_PRESETS = { mes: 'Este mês', mesAnt: 'Mês passado', tri: 'Últimos 3 meses', ano: 'Este ano', anoAnt: 'Ano passado', tudo: 'Todo o período', custom: 'Personalizado' };
function relPeriodo(r) {
  const h = hoje(), ym = h.slice(0, 7), y = +h.slice(0, 4);
  switch (r.preset) {
    case 'mes': return [ym + '-01', fimMes(ym)];
    case 'mesAnt': { const a = addMonths(ym + '-01', -1); return [a, fimMes(a.slice(0, 7))]; }
    case 'tri': return [addMonths(ym + '-01', -2), fimMes(ym)];
    case 'ano': return [y + '-01-01', y + '-12-31'];
    case 'anoAnt': return [(y - 1) + '-01-01', (y - 1) + '-12-31'];
    case 'custom': return [r.de || '', r.ate || ''];
    default: return ['', ''];
  }
}

function relTabela(s) {
  const isN = t => t === 'money' || t === 'num';
  if (!s.rows.length) return `<p class="muted" style="margin:0">Nada no período.</p>`;
  return `<div class="tablewrap"><table class="mini"><thead><tr>${s.cols.map(([l, t]) => `<th class="${isN(t) ? 'num' : ''}">${l}</th>`).join('')}</tr></thead>
    <tbody>${s.rows.map(r => `<tr ${r.open ? `data-open="${r.open}"` : ''}>${r.v.map((v, i) => `<td class="${isN(s.cols[i][1]) ? 'num' : ''} ${s.cols[i][1] === 'w' ? 'wrap' : ''}">${relCell(s.cols[i][1], v)}</td>`).join('')}</tr>`).join('')}</tbody>
    ${s.foot && s.rows.length > 1 ? `<tfoot><tr>${s.foot.map((v, i) => `<td class="${isN(s.cols[i][1]) ? 'num' : ''}">${i === 0 ? esc(v) : v === '' ? '' : s.cols[i][1] === 'money' ? fmtR(v) : fmtN(v)}</td>`).join('')}</tr></tfoot>` : ''}</table></div>`;
}
function renderRelatorio() {
  UI.rel = UI.rel || { preset: 'ano', clinica: '' };
  const r = UI.rel, R = relDados(), T = R.tot;
  const sec = s => `<div class="card rel-sec"><h3>${s.t}<small>${s.sub || ''}</small></h3>${relTabela(s)}</div>`;
  const by = id => R.S.find(s => s.id === id);
  $('#main').innerHTML = headHtml('Relatórios', 'Produção, financeiro e materiais por período e clínica', `<button class="btn" id="relCsv">Exportar para Excel</button><button class="btn primary" onclick="window.print()">Imprimir / PDF</button>`) + `
    <div class="toolbar">
      <select id="relPreset">${Object.entries(REL_PRESETS).map(([k, l]) => `<option value="${k}" ${r.preset === k ? 'selected' : ''}>${l}</option>`).join('')}</select>
      <label class="chk">De <input type="date" id="relDe" value="${esc(R.de)}"></label>
      <label class="chk">até <input type="date" id="relAte" value="${esc(R.ate)}"></label>
      <select id="relCl"><option value="">Todas as clínicas</option>${L('clinicas').map(c => `<option ${r.clinica === c ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select>
    </div>
    <p class="rel-periodo"><b>Período:</b> ${esc(R.txtPer)} · <b>Clínica:</b> ${esc(r.clinica || 'todas')} · emitido em ${fmtD(hoje())}</p>
    <div class="kpis">
      <div class="card kpi"><div class="l">Cirurgias</div><div class="v">${fmtN(T.cirurgias)}</div><div class="s">${fmtN(T.implantes)} implantes</div></div>
      <div class="card kpi"><div class="l">Reaberturas previstas</div><div class="v">${fmtN(T.reab)}</div><div class="s ${T.reabVenc ? 'neg' : ''}">${T.reabVenc} vencida(s) sem entrega</div></div>
      <div class="card kpi"><div class="l">Manutenções</div><div class="v">${fmtN(T.manut)}</div><div class="s ${T.manutVenc ? 'neg' : ''}">${T.manutFeitas} feita(s) · ${T.manutVenc} vencida(s)</div></div>
      <div class="card kpi"><div class="l">Próteses entregues</div><div class="v">${fmtN(T.entregas)}</div><div class="s">pela data de entrega</div></div>
      <div class="card kpi"><div class="l">Tomografias pedidas</div><div class="v">${fmtN(T.tomos)}</div><div class="s">pela data do pedido</div></div>
      <div class="card kpi"><div class="l">Contratado</div><div class="v">${fmtR(T.contratado)}</div><div class="s">${fmtR(T.pago)} pago</div></div>
      <div class="card kpi"><div class="l">Débito em aberto</div><div class="v">${fmtR(T.debito)}</div><div class="s">dos lançamentos do período</div></div>
      <div class="card kpi"><div class="l">Líquido</div><div class="v">${fmtR(T.liquido)}</div><div class="s">custos ${fmtR(T.custos)}</div></div>
    </div>
    ${sec(by('clinica'))}${sec(by('mes'))}${sec(by('plan'))}${sec(by('deb'))}${sec(by('reab'))}${sec(by('manut'))}${sec(by('cir'))}${sec(by('ent'))}
    <div class="grid2" style="margin-bottom:0">${sec(by('tomo'))}${sec(by('sefaz'))}</div>
    ${sec(by('mat'))}`;
  const upd = () => { saveUI(); renderRelatorio(); };
  $('#relPreset').onchange = e => { r.preset = e.target.value; if (r.preset === 'custom') [r.de, r.ate] = [R.de, R.ate]; upd(); };
  $('#relDe').onchange = e => { r.preset = 'custom'; r.de = e.target.value; r.ate = $('#relAte').value; upd(); };
  $('#relAte').onchange = e => { r.preset = 'custom'; r.ate = e.target.value; r.de = $('#relDe').value; upd(); };
  $('#relCl').onchange = e => { r.clinica = e.target.value; upd(); };
  document.querySelectorAll('.rel-sec tr[data-open]').forEach(tr => tr.onclick = () => { const [v, i] = tr.dataset.open.split(':'); openForm(v, i); });
  $('#relCsv').onclick = () => exportRelCsv(R);
}
function exportRelCsv(R) {
  const cell = v => { if (v === null || v === undefined) return ''; if (typeof v === 'number') return String(Math.round(v * 100) / 100).replace('.', ','); const s = String(v); return /[";\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const out = [['RELATÓRIO — SISTEMA DE IMPLANTES'], ['Período', R.txtPer], ['Clínica', UI.rel.clinica || 'todas'], ['Emitido em', fmtD(hoje())], [],
    ['RESUMO'], ['Cirurgias', R.tot.cirurgias], ['Implantes', R.tot.implantes], ['Reaberturas previstas', R.tot.reab], ['Reaberturas vencidas sem entrega', R.tot.reabVenc], ['Manutenções', R.tot.manut], ['Manutenções realizadas', R.tot.manutFeitas], ['Manutenções vencidas', R.tot.manutVenc], ['Próteses entregues', R.tot.entregas], ['Tomografias pedidas', R.tot.tomos],
    ['Contratado', R.tot.contratado], ['Pago', R.tot.pago], ['Débito em aberto', R.tot.debito], ['Custos', R.tot.custos], ['Líquido', R.tot.liquido]];
  for (const s of R.S) {
    out.push([], [s.t.toUpperCase()], s.cols.map(c => c[0]));
    for (const row of s.rows) out.push(row.v.map((v, i) => s.cols[i][1] === 'date' ? fmtD(v) : v));
    if (s.foot && s.rows.length > 1) out.push(s.foot);
  }
  download(`relatorio-implantes-${hoje()}.csv`, '﻿' + out.map(l => l.map(cell).join(';')).join('\r\n'), 'text/csv;charset=utf-8');
}

/* ============ exportação ============ */
function download(name, content, type) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([content], { type })); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); }
function exportCsv(view, rows) {
  const S = SCHEMAS[view];
  const fcols = S.fields.filter(f => f.k), ccols = S.cols.filter(c => c.calc);
  const cell = v => { if (v === null || v === undefined) return ''; if (typeof v === 'number') return String(v).replace('.', ','); const s = String(v); return /[";\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const head = [...fcols.map(f => f.l), ...ccols.map(c => c.l + ' (auto)')];
  const lines = rows.map(({ r, c }) => [...fcols.map(f => f.t === 'date' ? fmtD(r[f.k]) : f.t === 'pagamentos' ? (r[f.k] || []).map(p => [fmtD(p.data), fmtR(p.valor), p.forma].filter(Boolean).join(' ')).join(' | ') : f.t === 'manutencoes' ? (r[f.k] || []).map(m => [fmtD(m.data), m.realizada ? 'feita ' + fmtD(m.realizada) : 'pendente', m.obs].filter(Boolean).join(' ')).join(' | ') : r[f.k]), ...ccols.map(cc => cc.k === 'reabertura' || cc.t === 'date' ? fmtD(c[cc.k]) : c[cc.k])].map(cell).join(';'));
  download(`${S.titulo.toLowerCase()}-${hoje()}.csv`, '﻿' + [head.join(';'), ...lines].join('\r\n'), 'text/csv;charset=utf-8');
}

/* ============ configurações / backup ============ */
const LISTAS_NOMES = { clinicas: 'Clínicas', statusPaciente: 'Status do paciente', statusTomo: 'Status da tomografia', statusSefaz: 'Status SEFAZ', tipoArquivo: 'Tipo de arquivo', tipoExame: 'Tipo de exame', guia: 'Guia cirúrgico', planejamento: 'Planejamento', laboratorio: 'Laboratório', formaPagamento: 'Forma de pagamento', tipoRecebimento: 'Tipo de recebimento', cor: 'Cor', categoriaEstoque: 'Categoria de estoque', tipoMovimento: 'Tipo de movimento', localEstoque: 'Local de estoque', simNao: 'Sim / Não' };
function renderConfig() {
  $('#main').innerHTML = headHtml('Backup e cadastros', 'Onde os dados ficam, cópias de segurança e listas dos menus') + `<div class="settings">
    <section class="card"><h3>Conta e sincronização</h3>
      <p>Os dados ficam no servidor (Supabase) e qualquer alteração aparece na hora para todos que estão com o sistema aberto. Cada alteração fica guardada no histórico do servidor.</p>
      <p>Conectado como <b>${esc(usuario ? (usuario.nome || usuario.email) : '')}</b> — ${online ? '✅ online' : '⚠️ sem conexão'}.</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="sairBtn">Sair</button></div>
    </section>
    <section class="card"><h3>Cópia de segurança</h3>
      <p>Baixe uma cópia completa de tempos em tempos, ou restaure uma cópia anterior.</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="bkp">Baixar backup (.json)</button><label class="btn">Restaurar backup…<input type="file" id="restore" accept=".json,application/json" hidden></label></div>
    </section>
    <section class="card"><h3>Listas dos menus</h3><p>Um item por linha. Usadas nos campos de seleção e nos filtros.</p>
      <div class="lists">${Object.keys(LISTAS_NOMES).map(k => `<div class="f"><label style="font-size:12px;font-weight:600;color:var(--ink-2)">${LISTAS_NOMES[k]}</label><textarea data-lista="${k}">${esc(L(k).join('\n'))}</textarea></div>`).join('')}</div>
      <div style="margin-top:10px"><button class="btn primary" id="saveLists">Salvar listas</button></div>
    </section>
    <section class="card"><h3>Aparência</h3><div style="display:flex;gap:8px"><button class="btn" data-theme="">Automático</button><button class="btn" data-theme="light">Claro</button><button class="btn" data-theme="dark">Escuro</button></div></section>
  </div>`;
  $('#sairBtn').onclick = sair;
  $('#bkp').onclick = () => download(`backup-sistema-implantes-${hoje()}.json`, JSON.stringify(db, null, 1), 'application/json');
  $('#restore').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    try { const d = JSON.parse(await f.text()); if (!d.pacientes || !d.estoque) throw new Error('arquivo inválido');
      if (!confirm(`Restaurar backup de ${d.atualizadoEm ? new Date(d.atualizadoEm).toLocaleString('pt-BR') : 'data desconhecida'}? Os dados atuais serão substituídos para TODOS os usuários.`)) return;
      db = d; normDb(); persist(); render(); toast('Backup restaurado.'); } catch (err) { toast('Não foi possível ler o backup: ' + err.message); }
  };
  $('#saveLists').onclick = () => { document.querySelectorAll('[data-lista]').forEach(t => db.listas[t.dataset.lista] = t.value.split('\n').map(s => s.trim()).filter(Boolean)); persist(); toast('Listas salvas.'); };
  document.querySelectorAll('[data-theme]').forEach(b => b.onclick = () => { const t = b.dataset.theme; if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; try { localStorage.setItem(KEY + '_theme', t); } catch (e) {} });
}

/* ============ início ============ */
try { const t = localStorage.getItem(KEY + '_theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
iniciar();
</script>
